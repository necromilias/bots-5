[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bots5"
version = "0.1.0"
description = "Deterministic local harness for bounded multi-model jobs"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "httpx>=0.27,<1",
  "PySide6>=6.8,<7",
  "qasync>=0.28,<1",
  "SQLAlchemy>=2,<3",
  "alembic>=1,<2",
  "pydantic>=2,<3",
  "platformdirs>=4,<5",
  "uuid6>=2024.7.10,<2027",
  "keyring>=25,<26",
  "secretstorage>=3,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24,<1",
  "pytest-qt>=4.4,<5",
]

[project.scripts]
bots5 = "bots5.cli:main"
bots5-desktop = "bots5.bootstrap.desktop:main"

[tool.setuptools.packages.find]
where = ["src"]

[[tool.setuptools.ext-modules]]
name = "bots5.infrastructure.native._rooted_sqlite_vfs"
sources = ["src/bots5/infrastructure/native/rooted_sqlite_vfs.c"]
libraries = ["sqlite3", "dl", "pthread"]
extra-compile-args = ["-std=c11", "-Wall", "-Wextra", "-Werror"]
extra-link-args = ["-Wl,-z,relro,-z,now"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "local_qwen_acceptance: opt-in live acceptance against an operator-supplied local endpoint",
]
